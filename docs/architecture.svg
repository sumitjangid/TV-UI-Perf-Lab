<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" role="img" aria-labelledby="title description">
  <title id="title">TV UI Performance Lab current architecture</title>
  <desc id="description">Catalog generation creates static JSON. React and Redux render windowed shelves and cards, remote keys update focus, experiments store assignments and events locally, and accessibility and benchmark processes feed CI before Vercel deployment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526477"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #172635; }
      .title { font-size: 24px; font-weight: 700; }
      .group-title { font-size: 16px; font-weight: 700; }
      .node-title { font-size: 14px; font-weight: 700; }
      .node-detail { font-size: 12px; fill: #526477; }
      .panel { fill: #f5f8fb; stroke: #bdcbd8; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #8da1b3; stroke-width: 1.5; }
      .data-node { fill: #e8f5f2; stroke: #4b9b88; stroke-width: 1.5; }
      .runtime-node { fill: #edf3fa; stroke: #6a8fb5; stroke-width: 1.5; }
      .quality-node { fill: #fff8e6; stroke: #d4aa4e; stroke-width: 1.5; }
      .edge { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="1120" rx="18" fill="#ffffff"/>
  <text class="title" x="40" y="42">TV UI Performance Lab — Current Architecture</text>

  <rect class="panel" x="30" y="65" width="940" height="155" rx="14"/>
  <text class="group-title" x="55" y="96">Catalog preparation · separate Node process</text>
  <rect class="node" x="60" y="120" width="220" height="70" rx="10"/>
  <text class="node-title" x="78" y="149">npm run generate:catalog</text>
  <text class="node-detail" x="78" y="171">Generate deterministic fixture</text>
  <rect class="node" x="365" y="120" width="250" height="70" rx="10"/>
  <text class="node-title" x="385" y="149">scripts/generate-catalog.ts</text>
  <text class="node-detail" x="385" y="171">40 rows × 250 titles</text>
  <rect class="data-node" x="670" y="120" width="230" height="70" rx="10"/>
  <text class="node-title" x="690" y="149">public/catalog.json</text>
  <text class="node-detail" x="690" y="171">Local posters + synthetic titles</text>
  <path class="edge" d="M280 155 H355"/>
  <path class="edge" d="M615 155 H660"/>

  <rect class="panel" x="30" y="250" width="940" height="300" rx="14"/>
  <text class="group-title" x="55" y="281">Browser runtime · Vite + React + Redux</text>
  <rect class="runtime-node" x="60" y="315" width="190" height="74" rx="10"/>
  <text class="node-title" x="80" y="344">index.html → main.tsx</text>
  <text class="node-detail" x="80" y="367">Redux Provider + createRoot</text>
  <rect class="runtime-node" x="320" y="315" width="230" height="74" rx="10"/>
  <text class="node-title" x="340" y="344">focusSlice + store</text>
  <text class="node-detail" x="340" y="367">Row, column, per-row memory</text>
  <rect class="runtime-node" x="670" y="315" width="230" height="74" rx="10"/>
  <text class="node-title" x="690" y="344">App.tsx</text>
  <text class="node-detail" x="690" y="367">Windows, cards, selection</text>
  <path class="edge" d="M250 352 H310"/>
  <path class="edge" d="M550 352 H660"/>
  <rect class="node" x="320" y="420" width="230" height="54" rx="10"/>
  <text class="node-title" x="340" y="453">useRemoteKeys.ts</text>
  <text class="node-detail" x="340" y="470">Arrow, Enter, Escape</text>
  <rect class="node" x="670" y="420" width="230" height="54" rx="10"/>
  <text class="node-title" x="690" y="453">virtualRange.ts</text>
  <text class="node-detail" x="690" y="470">Bounded row/tile windows</text>
  <rect class="node" x="60" y="470" width="190" height="54" rx="10"/>
  <text class="node-title" x="80" y="503">App.css · index.css</text>
  <text class="node-detail" x="80" y="520">Layout + focus + motion</text>
  <path class="edge" d="M785 389 V410"/>
  <path class="edge" d="M435 389 V410"/>
  <path class="edge" d="M785 190 V305"/>
  <rect x="800" y="235" width="130" height="35" rx="7" fill="#ffffff" stroke="#bdcbd8"/>
  <text class="node-detail" x="812" y="257">fetches JSON</text>

  <rect class="panel" x="30" y="580" width="940" height="160" rx="14"/>
  <text class="group-title" x="55" y="611">Experiments and accessibility</text>
  <rect class="quality-node" x="60" y="645" width="220" height="70" rx="10"/>
  <text class="node-title" x="78" y="674">bucketing.ts + events.ts</text>
  <text class="node-detail" x="78" y="696">Sticky variants + local events</text>
  <rect class="quality-node" x="365" y="645" width="250" height="70" rx="10"/>
  <text class="node-title" x="385" y="674">analysis.ts</text>
  <text class="node-detail" x="385" y="696">Synthetic z-test reporting</text>
  <rect class="quality-node" x="670" y="645" width="230" height="70" rx="10"/>
  <text class="node-title" x="690" y="674">Accessibility UI</text>
  <text class="node-detail" x="690" y="696">Skip link · live region · reduced motion</text>
  <path class="edge" d="M280 680 H355"/>
  <path class="edge" d="M615 680 H660"/>

  <rect class="panel" x="30" y="770" width="940" height="165" rx="14"/>
  <text class="group-title" x="55" y="801">Benchmark and quality gates</text>
  <rect class="node" x="60" y="835" width="250" height="70" rx="10"/>
  <text class="node-title" x="78" y="864">scripts/benchmark.ts</text>
  <text class="node-detail" x="78" y="886">Playwright + CDP + JSON output</text>
  <rect class="node" x="365" y="835" width="250" height="70" rx="10"/>
  <text class="node-title" x="385" y="864">budgets + check-budgets</text>
  <text class="node-detail" x="385" y="886">Windowed 4× performance gate</text>
  <rect class="node" x="670" y="835" width="230" height="70" rx="10"/>
  <text class="node-title" x="690" y="864">Playwright + axe + Node tests</text>
  <text class="node-detail" x="690" y="886">Keyboard, units, accessibility</text>
  <path class="edge" d="M310 870 H355"/>
  <path class="edge" d="M615 870 H660"/>

  <rect class="panel" x="30" y="965" width="940" height="125" rx="14"/>
  <text class="group-title" x="55" y="996">CI and deployment</text>
  <rect class="quality-node" x="110" y="1025" width="300" height="58" rx="10"/>
  <text class="node-title" x="128" y="1050">GitHub Actions</text>
  <text class="node-detail" x="128" y="1070">Lint · unit · build · e2e · bench</text>
  <rect class="quality-node" x="590" y="1025" width="300" height="58" rx="10"/>
  <text class="node-title" x="608" y="1050">Vercel · vercel.json</text>
  <text class="node-detail" x="608" y="1070">Vite build · dist static output</text>
  <path class="edge" d="M410 1054 H580"/>
</svg>
