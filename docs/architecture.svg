<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title description">
  <title id="title">TV UI Performance Lab current architecture</title>
  <desc id="description">A build-time catalog generator writes a JSON file. Separately, the browser loads index.html, starts the React entry point, and renders the app with its styles. A dashed arrow shows the catalog is not yet imported into the app.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526477" />
    </marker>
    <marker id="planned-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6b16" />
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #172635; }
      .title { font-size: 24px; font-weight: 700; }
      .group-title { font-size: 16px; font-weight: 700; }
      .node-title { font-size: 14px; font-weight: 700; }
      .node-detail { font-size: 12px; fill: #526477; }
      .panel { fill: #f5f8fb; stroke: #bdcbd8; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #8da1b3; stroke-width: 1.5; }
      .data-node { fill: #e8f5f2; stroke: #4b9b88; stroke-width: 1.5; }
      .runtime-node { fill: #edf3fa; stroke: #6a8fb5; stroke-width: 1.5; }
      .edge { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#arrow); }
      .planned-edge { fill: none; stroke: #9a6b16; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#planned-arrow); }
      .planned-label { font-size: 11px; font-weight: 600; fill: #80580e; }
    </style>
  </defs>

  <rect width="1000" height="560" rx="18" fill="#ffffff" />
  <text class="title" x="40" y="42">TV UI Performance Lab — Current Architecture</text>

  <rect class="panel" x="30" y="65" width="940" height="155" rx="14" />
  <text class="group-title" x="55" y="96">Catalog preparation · separate Node process</text>

  <rect class="node" x="60" y="120" width="220" height="70" rx="10" />
  <text class="node-title" x="78" y="149">npm run generate:catalog</text>
  <text class="node-detail" x="78" y="171">Manual generation command</text>

  <rect class="node" x="365" y="120" width="250" height="70" rx="10" />
  <text class="node-title" x="385" y="149">scripts/generate-catalog.ts</text>
  <text class="node-detail" x="385" y="171">Creates 40 × 250 synthetic titles</text>

  <rect class="data-node" x="670" y="120" width="230" height="70" rx="10" />
  <text class="node-title" x="690" y="149">src/data/catalog.json</text>
  <text class="node-detail" x="690" y="171">Generated fixture</text>

  <path class="edge" d="M280 155 H355" />
  <path class="edge" d="M615 155 H660" />

  <rect class="panel" x="30" y="250" width="940" height="280" rx="14" />
  <text class="group-title" x="55" y="281">Browser runtime · Vite + React</text>

  <rect class="runtime-node" x="60" y="325" width="190" height="74" rx="10" />
  <text class="node-title" x="80" y="354">index.html</text>
  <text class="node-detail" x="80" y="377">#root mount point</text>

  <rect class="runtime-node" x="320" y="325" width="230" height="74" rx="10" />
  <text class="node-title" x="340" y="354">src/main.tsx</text>
  <text class="node-detail" x="340" y="377">createRoot + StrictMode</text>

  <rect class="runtime-node" x="670" y="325" width="230" height="74" rx="10" />
  <text class="node-title" x="690" y="354">src/App.tsx</text>
  <text class="node-detail" x="690" y="377">Current welcome screen</text>

  <path class="edge" d="M250 362 H310" />
  <path class="edge" d="M550 362 H660" />

  <rect class="node" x="320" y="445" width="230" height="54" rx="10" />
  <text class="node-title" x="340" y="478">src/index.css · global styles</text>

  <rect class="node" x="670" y="445" width="230" height="54" rx="10" />
  <text class="node-title" x="690" y="478">src/App.css · app styles</text>

  <path class="edge" d="M435 399 V435" />
  <path class="edge" d="M785 399 V435" />

  <path class="planned-edge" d="M785 190 V315" />
  <rect x="800" y="258" width="158" height="35" rx="7" fill="#fff8e6" stroke="#e1c583" />
  <text class="planned-label" x="811" y="280">Not imported yet</text>
</svg>
